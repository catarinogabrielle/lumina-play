<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente de Borda Gamer Neon -->
    <linearGradient id="neonBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Gradiente do Núcleo Escuro com Profundidade -->
    <radialGradient id="coreBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#151b38" />
      <stop offset="60%" stop-color="#090d20" />
      <stop offset="100%" stop-color="#04060d" />
    </radialGradient>

    <!-- Gradiente Dourado da Estrela de Luz (Lumina) -->
    <linearGradient id="starGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Gradiente Ciano dos Botões -->
    <linearGradient id="cyanActionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filtro de Brilho Neon (Glow) -->
    <filter id="luminaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0 0.4 0 0  0 0 0 1 0" result="coloredGlow"/>
      <feMerge>
        <feMergeNode in="coloredGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Brilho Externo Difuso -->
  <rect x="40" y="40" width="432" height="432" rx="112" fill="url(#neonBorderGrad)" opacity="0.35" filter="url(#luminaGlow)"/>

  <!-- Placa Base / Escudo Squircle Gamer -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#coreBgGrad)" stroke="url(#neonBorderGrad)" stroke-width="12"/>

  <!-- Anel de Órbita Holográfica Pontilhada -->
  <circle cx="256" cy="256" r="170" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="8 12" opacity="0.45"/>

  <!-- Silhueta Principal do Controle Gamer Moderno -->
  <path d="
    M 170 180
    C 130 180, 100 210, 95 255
    C 88 320, 115 370, 155 370
    C 180 370, 195 345, 215 325
    C 230 310, 245 305, 256 305
    C 267 305, 282 310, 297 325
    C 317 345, 332 370, 357 370
    C 397 370, 424 320, 417 255
    C 412 210, 382 180, 342 180
    L 170 180 Z
  " fill="#0f162e" stroke="url(#neonBorderGrad)" stroke-width="6"/>

  <!-- Luzes de Apoio / Grips do Controle -->
  <path d="M 125 295 C 120 330, 138 352, 160 352" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 387 295 C 392 330, 374 352, 352 352" stroke="#d946ef" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- D-Pad Direcional Cruzado (Esquerda) -->
  <g transform="translate(145, 235)">
    <!-- Cruz Central -->
    <path d="
      M -10 -30 H 10 V -10 H 30 V 10 H 10 V 30 H -10 V 10 H -30 V -10 H -10 Z
    " fill="#1e293b" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8"/>
    <!-- Setinhas indicadoras -->
    <path d="M 0 -22 L -4 -16 L 4 -16 Z" fill="#67e8f9"/>
    <path d="M 0 22 L -4 16 L 4 16 Z" fill="#67e8f9"/>
    <path d="M -22 0 L -16 -4 L -16 4 Z" fill="#67e8f9"/>
    <path d="M 22 0 L 16 -4 L 16 4 Z" fill="#67e8f9"/>
  </g>

  <!-- Botões de Ação Diamante (Direita) -->
  <g transform="translate(367, 235)">
    <!-- Botão Superior (Y) -->
    <circle cx="0" cy="-20" r="10" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="0" cy="-20" r="4" fill="#fbbf24"/>

    <!-- Botão Direito (B) -->
    <circle cx="20" cy="0" r="10" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="20" cy="0" r="4" fill="#f43f5e"/>

    <!-- Botão Inferior (A) -->
    <circle cx="0" cy="20" r="10" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <circle cx="0" cy="20" r="4" fill="#34d399"/>

    <!-- Botão Esquerdo (X) -->
    <circle cx="-20" cy="0" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="-20" cy="0" r="4" fill="#38bdf8"/>
  </g>

  <!-- ESTRELA RADIANTE LUMINA (CENTRO / CORAÇÃO DO CONTROLE) -->
  <!-- Raios de Brilho Expansivo -->
  <g filter="url(#starGlow)">
    <!-- Estrela Central Lumina de 8 Pontas -->
    <path d="
      M 256 160
      Q 256 225, 288 245
      Q 256 250, 256 315
      Q 256 250, 224 245
      Q 256 225, 256 160 Z
    " fill="url(#starGoldGrad)"/>

    <path d="
      M 180 236
      Q 235 240, 245 220
      Q 250 240, 332 236
      Q 250 240, 245 260
      Q 235 240, 180 236 Z
    " fill="url(#starGoldGrad)"/>

    <!-- Pontas Diagonais Sutis -->
    <path d="
      M 205 185
      Q 245 230, 256 236
      Q 245 242, 205 287
      Q 248 242, 256 236
      Q 248 230, 205 185 Z
    " fill="#fef08a" opacity="0.85"/>

    <path d="
      M 307 185
      Q 267 230, 256 236
      Q 267 242, 307 287
      Q 264 242, 256 236
      Q 264 230, 307 185 Z
    " fill="#fef08a" opacity="0.85"/>

    <!-- Ponto de Luz Puro no Epicentro -->
    <circle cx="256" cy="236" r="11" fill="#ffffff"/>
    <circle cx="256" cy="236" r="5" fill="#fef08a"/>
  </g>

  <!-- Símbolo Play Triângulo Sutíl Integrado no Topo -->
  <path d="M 250 115 L 268 126 L 250 137 Z" fill="#00f2fe" opacity="0.9"/>
  <circle cx="256" cy="126" r="18" stroke="#00f2fe" stroke-width="2.5" opacity="0.4"/>
</svg>
