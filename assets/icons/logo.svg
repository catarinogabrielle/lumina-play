<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="luminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="#080b18" stroke="url(#luminaGrad)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Radiant Light rays behind cross/controller -->
  <circle cx="50" cy="50" r="28" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Stylized Gamepad / Light Cross Emblem -->
  <!-- D-Pad -->
  <path d="M 28 44 h 6 v -6 a 2 2 0 0 1 2 -2 h 4 a 2 2 0 0 1 2 2 v 6 h 6 a 2 2 0 0 1 2 2 v 4 a 2 2 0 0 1 -2 2 h -6 v 6 a 2 2 0 0 1 -2 2 h -4 a 2 2 0 0 1 -2 -2 v -6 h -6 a 2 2 0 0 1 -2 -2 v -4 a 2 2 0 0 1 2 -2 Z" fill="#38bdf8"/>

  <!-- Action Diamond / Radiant Star Buttons -->
  <circle cx="68" cy="42" r="3.2" fill="#a855f7" />
  <circle cx="76" cy="50" r="3.2" fill="#00f2fe" />
  <circle cx="60" cy="50" r="3.2" fill="#fbbf24" />
  <circle cx="68" cy="58" r="3.2" fill="#34d399" />

  <!-- Center Lumina Star Sparkle -->
  <path d="M 50 20 L 52 30 L 62 32 L 52 34 L 50 44 L 48 34 L 38 32 L 48 30 Z" fill="#ffffff" opacity="0.9"/>
</svg>
